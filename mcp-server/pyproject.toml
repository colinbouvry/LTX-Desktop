[project]
name = "ltx-desktop-mcp"
version = "0.1.0"
description = "MCP server for LTX Desktop local video generation"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
ltx-desktop-mcp = "ltx_desktop_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ltx_desktop_mcp"]
